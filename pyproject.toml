# Lint / type-check configuration for the backend. Packaging is not managed
# here - dependencies stay in requirements*.txt (see AGENTS.md).

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["frontend"]

[tool.ruff.lint]
# Defaults (pyflakes + a pycodestyle core) plus import sorting.
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
# The sanitizer tests feed deliberately hostile control characters through
# the persona pipeline; that is the point of the test, not obfuscation.
"tests/test_persona.py" = ["PLE2502"]

[tool.mypy]
files = ["api", "core"]
python_version = "3.12"
# Third-party SDKs (langchain, elevenlabs helpers, ...) ship without stubs;
# the value here is checking our own annotations, not theirs.
ignore_missing_imports = true
check_untyped_defs = true
