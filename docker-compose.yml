services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # Mount source code for editing (restart the container to pick up changes;
      # uvicorn runs without --reload)
      - .:/app
      # Anonymous volume masks the host's .venv/ (macOS/linux-native binaries)
      # so it can't shadow anything inside the container. Deps are installed
      # into the image's system site-packages, not into /app/.venv.
      - /app/.venv
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      # Hot reload: mount source code
      - ./frontend:/app
      # Prevent overwriting container's node_modules
      - /app/node_modules
    depends_on:
      - api
    environment:
      # Point Vite proxy to api service
      - VITE_API_URL=http://api:8000
